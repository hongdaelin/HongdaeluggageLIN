<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>캐리어 보관 서비스</title>
<style>
  :root{
    --bg:#14171c;
    --surface:#1c2129;
    --surface-2:#242b35;
    --accent:#c9974a;
    --accent-soft:#8a6a38;
    --text:#eef1f4;
    --text-dim:#93a0ad;
    --border:#2f3742;
    font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic','Pretendard',sans-serif;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);min-height:100vh;
    display:flex;align-items:center;justify-content:center;padding:24px;}
  .wrap{max-width:420px;width:100%;}
  header{text-align:center;margin-bottom:28px;}
  header .icon{font-size:40px;margin-bottom:8px;}
  header h1{font-size:21px;font-weight:800;margin:0 0 6px;letter-spacing:-0.02em;}
  header p{font-size:13px;color:var(--text-dim);margin:0;}
  a.card{
    display:block;background:var(--surface);border:1px solid var(--border);border-radius:16px;
    padding:20px;margin-bottom:14px;text-decoration:none;color:var(--text);
    transition:border-color .15s;
  }
  a.card:hover{border-color:var(--accent-soft);}
  a.card .row{display:flex;align-items:center;gap:14px;}
  a.card .emoji{font-size:26px;width:44px;height:44px;background:var(--surface-2);
    border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  a.card .t{flex:1;}
  a.card .t .name{font-size:15.5px;font-weight:800;margin-bottom:3px;}
  a.card .t .desc{font-size:12.5px;color:var(--text-dim);line-height:1.4;}
  a.card .arrow{color:var(--accent);font-size:18px;flex-shrink:0;}
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="icon">🧳</div>
      <h1>캐리어 보관 서비스</h1>
      <p>원하시는 페이지를 선택해주세요</p>
    </header>

    <a class="card" href="./캐리어_현장접수.html">
      <div class="row">
        <div class="emoji">📝</div>
        <div class="t">
          <div class="name">현장접수</div>
          <div class="desc">방문 손님이 바로 짐을 맡기고 번호표를 받는 페이지</div>
        </div>
        <div class="arrow">›</div>
      </div>
    </a>

    <a class="card" href="./캐리어_보관_예약.html">
      <div class="row">
        <div class="emoji">📅</div>
        <div class="t">
          <div class="name">미리 예약하기</div>
          <div class="desc">방문 전 미리 예약하고 대기 없이 접수하는 페이지</div>
        </div>
        <div class="arrow">›</div>
      </div>
    </a>

    <a class="card" href="./캐리어_보관_관리_6.html">
      <div class="row">
        <div class="emoji">🗂️</div>
        <div class="t">
          <div class="name">관리자 페이지</div>
          <div class="desc">직원용 — 접수·예약 확인, 요금 설정, 완료 처리</div>
        </div>
        <div class="arrow">›</div>
      </div>
    </a>
  </div>
</body></html>
