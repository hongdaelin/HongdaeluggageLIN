  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:60px;}
  .wrap{max-width:480px;margin:0 auto;padding:28px 20px 0;}

  header{text-align:center;margin-bottom:22px;}

  header h1{font-size:20px;font-weight:800;margin:0 0 6px;letter-spacing:-0.02em;}
  header p{font-size:13px;color:var(--text-dim);margin:0;line-height:1.5;}

  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:22px 20px;margin-bottom:16px;}
  .card h2{font-size:14px;margin:0 0 14px;font-weight:800;color:var(--text-dim);letter-spacing:.02em;}

  .field{margin-bottom:14px;}
  .field:last-child{margin-bottom:0;}
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  label{font-size:12.5px;color:var(--text-dim);display:block;margin-bottom:6px;font-weight:700;}
  input[type=text],input[type=tel],input[type=number],input[type=date],input[type=time]{
    width:100%;background:var(--surface-2);border:1px solid var(--border);color:var(--text);
    padding:12px 13px;border-radius:10px;font-family:inherit;font-size:15px;
  }
  input:focus{outline:none;border-color:var(--accent-soft);}
  input::placeholder{color:#5f6b78;}

  .time-select-row{display:flex;align-items:center;gap:6px;}
  .time-select-row select{
    flex:1;background:var(--surface-2);border:1px solid var(--border);color:var(--text);
    padding:12px 8px;border-radius:10px;font-family:inherit;font-size:15px;text-align:center;
  }
  .time-select-row select:focus{outline:none;border-color:var(--accent-soft);}
  .time-colon{color:var(--text-dim);font-weight:700;}

  .stepper{display:flex;align-items:center;gap:12px;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:6px 10px;}
  .stepper button{
    width:32px;height:32px;border-radius:8px;border:none;background:var(--surface-3);color:var(--text);
    font-size:17px;font-weight:700;cursor:pointer;flex-shrink:0;
  }
  .stepper button:active{background:var(--accent);color:#1b1204;}
  .stepper .count{flex:1;text-align:center;font-size:16px;font-weight:800;}

  .duration-toggle{display:flex;gap:8px;}

    flex:1;padding:12px 0;border-radius:10px;border:1px solid var(--border);
    background:var(--surface-2);color:var(--text-dim);font-family:inherit;font-weight:700;

  .hint{font-size:11.5px;color:var(--text-dim);margin-top:7px;line-height:1.5;}

function applyLang(lang){
  if(!I18N[lang]) lang='ko';
  currentLang=lang;
  try{ localStorage.setItem('carrier:resLang', lang); }catch(e){}
  document.documentElement.lang = lang;
  document.querySelectorAll('#langToggle button').forEach(b=>{
    b.classList.toggle('sel', b.dataset.lang===lang);
  });

  });

let hasFirebase = false;
let db = null;
try{
  if(typeof firebase !== 'undefined'){
    firebase.initializeApp(firebaseConfig);
    db = firebase.firestore();
    hasFirebase = true;
  }else{
    console.error('Firebase SDK 로드 실패 — 로컬 저장소만 사용합니다.');
  }
}catch(e){
  console.error('Firebase 초기화 실패 — 로컬 저장소만 사용합니다.', e);
}

function lsGet(key){
  try{ const raw=localStorage.getItem(key); return raw!==null? {key, value:raw} : null; }catch(e){ return null; }
}
function lsSet(key, value){ try{ localStorage.setItem(key, value); }catch(e){ console.error('로컬 저장 실패', e); } }
async function safeGet(key){
  if(hasFirebase){
    try{
      const doc = await db.collection('carrier_data').doc(key).get();
      if(doc.exists && doc.data() && doc.data().value!=null){
        const value = doc.data().value;
        lsSet(key, value);
        return {key, value};
      }
    }catch(e){ console.error('Firestore 읽기 실패, 로컬 데이터 사용', e); }
  }
  return lsGet(key);
}
async function safeSet(key, value){
  lsSet(key, value);
  if(hasFirebase){
    try{
      await db.collection('carrier_data').doc(key).set({ value, updatedAt: Date.now() });
    }catch(e){ console.error('Firestore 저장 실패(로컬에는 저장됨)', e); }
  }
}
async function loadConfig(){
  const c=await safeGet(KEY_CONFIG);
  if(c) config=Object.assign({}, DEFAULT_CONFIG, JSON.parse(c.value));
}
async function loadReservations(){
  const r=await safeGet(KEY_RESERVATIONS);
  reservations=r?JSON.parse(r.value):[];
}
async function saveReservations(){
  await safeSet(KEY_RESERVATIONS, JSON.stringify(reservations));
}


function won(n){ return Math.round(n).toLocaleString('ko-KR')+'원'; }

function calcPrice(carrierCount, otherCount, duration){
  let price=0;
  if(carrierCount>0){
    const tierTable=config.carrierPricing[duration]||{};
    if(tierTable[carrierCount]!=null){
      price+=tierTable[carrierCount];
    }else{
      const keys=Object.keys(tierTable).map(Number).sort((a,b)=>a-b);
      if(keys.length){
        const maxKey=keys[keys.length-1];
        const perUnit=tierTable[maxKey]/maxKey;
        price+=Math.round(perUnit*carrierCount);
      }
    }
  }
  if(otherCount>0) price += otherCount * (config.otherItemPrice||0);
  return price;
}
function updatePricePreview(){
  document.getElementById('pricePreview').textContent = won(calcPrice(carrierCount, otherCount, selectedDuration));
}

// 스텝퍼
document.querySelectorAll('.stepper button').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    const target=btn.dataset.target;
    const delta=parseInt(btn.dataset.step,10);
    if(target==='inCarrier'){ carrierCount=Math.max(0, carrierCount+delta); document.getElementById('inCarrierLabel').textContent=carrierCount; }
    else{ otherCount=Math.max(0, otherCount+delta); document.getElementById('inOtherLabel').textContent=otherCount; }
    updatePricePreview();
  });
});

// 보관시간 토글
document.querySelectorAll('.duration-toggle button').forEach(b=>{
  b.addEventListener('click', ()=>{
    document.querySelectorAll('.duration-toggle button').forEach(x=>x.classList.remove('sel'));
    b.classList.add('sel');
    selectedDuration=b.dataset.dur;
    updatePricePreview();
  });
});

// 시간 드롭다운(24시간제, 5분 단위) 채우기 — 기기 언어와 무관하게 항상 동일한 숫자 표기
function populateTimeSelects(){
  const hourSel=document.getElementById('inTimeHour');
  const minSel=document.getElementById('inTimeMinute');
  hourSel.innerHTML='';
  for(let h=0; h<24; h++){
    const opt=document.createElement('option');
    opt.value=String(h).padStart(2,'0');
    opt.textContent=String(h).padStart(2,'0');
    hourSel.appendChild(opt);
  }
  minSel.innerHTML='';
  for(let m=0; m<60; m+=5){
    const opt=document.createElement('option');
    opt.value=String(m).padStart(2,'0');
    opt.textContent=String(m).padStart(2,'0');
    minSel.appendChild(opt);
  }
}

// 기본 날짜/시간 = 오늘, 현재시각+30분(5분 단위로 반올림)
function setDefaultDateTime(){
  const now=new Date();
  now.setMinutes(now.getMinutes()+30);
  now.setMinutes(Math.round(now.getMinutes()/5)*5);
  document.getElementById('inDate').value=now.toISOString().slice(0,10);
  document.getElementById('inTimeHour').value=String(now.getHours()%24).padStart(2,'0');
  document.getElementById('inTimeMinute').value=String(now.getMinutes()%60).padStart(2,'0');
}

document.getElementById('reserveBtn').addEventListener('click', async ()=>{
  const name=document.getElementById('inName').value.trim();
  const phone=document.getElementById('inPhone').value.trim();
  const date=document.getElementById('inDate').value;
  const time=document.getElementById('inTimeHour').value+':'+document.getElementById('inTimeMinute').value;

  if(!name || !phone){ alert(t('alertName')); return; }
  if(carrierCount<=0 && otherCount<=0){ alert(t('alertLuggage')); return; }
  if(!date || !time){ alert(t('alertDate')); return; }

  const expectedArrival=new Date(date+'T'+time+':00').toISOString();
  const price=calcPrice(carrierCount, otherCount, selectedDuration);

  const reservation={
    id:'rv_'+Date.now()+'_'+Math.random().toString(36).slice(2,7),
    name, phone, carrierCount, otherCount, duration:selectedDuration,
    expectedArrival, price,
    createdAt:new Date().toISOString(),
    status:'waiting'
  };

  const btn=document.getElementById('reserveBtn');
  btn.disabled=true; btn.textContent=t('reserveBtnLoading');
  await loadReservations();
  reservations.push(reservation);
  await saveReservations();
  btn.disabled=false; btn.textContent=t('reserveBtn');

  lastReservation=reservation;
  showDoneScreen(reservation);
});

function showDoneScreen(rv){
  const d=new Date(rv.expectedArrival);
  const days=t('days');
  const hh=String(d.getHours()).padStart(2,'0');
  const mm=String(d.getMinutes()).padStart(2,'0');
  const dateLabel=t('dateFmt')(d.getMonth()+1, d.getDate(), days[d.getDay()], `${hh}:${mm}`);
  document.getElementById('doneCard').innerHTML=`
    <div class="done-row"><span class="k">${t('doneName')}</span><span class="v">${escapeHtml(rv.name)}</span></div>
    <div class="done-row"><span class="k">${t('donePhone')}</span><span class="v">${escapeHtml(rv.phone)}</span></div>
    <div class="done-row"><span class="k">${t('doneLuggage')}</span><span class="v">${t('luggageFmt')(rv.carrierCount, rv.otherCount)}</span></div>
    <div class="done-row"><span class="k">${t('doneDuration')}</span><span class="v">${rv.duration==='5h'?t('dur5hPass'):t('dur1dPass')}</span></div>
    <div class="done-row"><span class="k">${t('doneArrival')}</span><span class="v">${dateLabel}</span></div>
    <div class="done-row"><span class="k">${t('donePrice')}</span><span class="v" style="color:var(--accent);">${won(rv.price)}</span></div>
  `;
  document.getElementById('formScreen').style.display='none';
  document.getElementById('doneScreen').style.display='block';
}
function escapeHtml(str){ const d=document.createElement('div'); d.textContent=str; return d.innerHTML; }

document.getElementById('againBtn').addEventListener('click', ()=>{
  document.getElementById('inName').value='';
  document.getElementById('inPhone').value='';
  carrierCount=0; otherCount=0;
  document.getElementById('inCarrierLabel').textContent='0';
  document.getElementById('inOtherLabel').textContent='0';
  setDefaultDateTime();
  updatePricePreview();
  lastReservation=null;
  document.getElementById('doneScreen').style.display='none';
  document.getElementById('formScreen').style.display='block';
});

// 초기화
(async function init(){
  let savedLang='ko';
  try{ savedLang=localStorage.getItem('carrier:resLang')||'ko'; }catch(e){}
  applyLang(savedLang);
  populateTimeSelects();
  setDefaultDateTime();
  await loadConfig();
  updatePricePreview();
})();
</script>
